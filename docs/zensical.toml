[project]
site_name = "Aposlop Documentation"
site_description = "Installation, usage, configuration, language, output, and analysis documentation for Aposlop."
site_url = "https://aposlop.ezygang.digital/"
docs_dir = "content"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Overview" = "getting-started/index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Quick start" = "getting-started/quickstart.md" },
  ] },
  { "Using Aposlop" = [
    { "Configuration" = "configuration/index.md" },
    { "Configuration precedence" = "configuration/precedence.md" },
    { "Exclusions" = "configuration/exclusions.md" },
    { "Duplicate results" = "concepts/duplicate-types.md" },
    { "Complexity results" = "concepts/complexity.md" },
    { "File length" = "concepts/file-length.md" },
    { "Cache" = "operations/cache.md" },
    { "Output formats" = "operations/output.md" },
    { "Diagnostics" = "operations/diagnostics.md" },
  ] },
  { "Languages" = [
    { "Overview" = "languages/index.md" },
    { "Go" = "languages/go.md" },
    { "Rust" = "languages/rust.md" },
    { "Python" = "languages/python.md" },
    { "TypeScript and TSX" = "languages/typescript.md" },
  ] },
  { "Agent skills" = [
    { "Overview" = "skills/index.md" },
    { "Aposlop" = "skills/aposlop.md" },
    { "Code changes" = "skills/code-changes.md" },
    { "Test changes" = "skills/test-changes.md" },
    { "Deslop tests" = "skills/deslop-tests.md" },
    { "Deslop turbo" = "skills/deslop-turbo.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Configuration" = "reference/configuration.md" },
    { "JSON report" = "reference/json-report.md" },
    { "Exit codes" = "reference/exit-codes.md" },
  ] },
  { "Under the hood" = "concepts/how-it-works.md" },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "images/icon.png"
favicon = "images/icon.png"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.meta-descriptions]
trim = true

[project.plugins.social]

[project.plugins.privacy]
assets_include = ["fonts.googleapis.com/*", "fonts.gstatic.com/*"]

[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Getting started" = ["index.md", "getting-started/*.md"]
"Using Aposlop" = ["configuration/*.md", "concepts/duplicate-types.md", "concepts/complexity.md", "concepts/file-length.md", "operations/*.md"]
"Languages" = ["languages/*.md"]
"Agent skills" = ["skills/*.md"]
"Reference" = ["reference/*.md"]
"Under the hood" = ["concepts/how-it-works.md"]

# Zensical's default Markdown extensions, listed in full because setting one option replaces
# the whole default set. The only change is anchor_linenums: line-number anchors are links
# without text, which screen readers and Lighthouse report on every page with a code block.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = false
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

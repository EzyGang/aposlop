[package]
name = "aposlop"
version = "1.1.2"
edition = "2024"
description = "Detect duplicated code and report cyclomatic complexity across Go, Rust, Python, TypeScript, and TSX"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EzyGang/aposlop"
homepage = "https://github.com/EzyGang/aposlop"
documentation = "https://aposlop.ezygang.digital/"
readme = "README.md"
keywords = ["duplicates", "complexity", "cli", "tree-sitter", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

[dependencies]
anyhow = "1.0"
bincode = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
minreq = { version = "3.0", default-features = false, features = ["https-rustls-probe"] }
rayon = "1.11"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
thiserror = "2.0"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish. Leave empty to create one from Cargo.toml.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-tag:
    name: Create release tag from Cargo version
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create tag and start signed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo package version must match MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag="v${version}"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "release tag already exists: ${tag}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "Aposlop ${version}"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f "release_tag=${tag}"

  prepare:
    if: github.event_name == 'push' || inputs.release_tag != ''
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate tag and Cargo version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "requested tag $REQUESTED_TAG does not match ref $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "tag $version and Cargo $cargo_version must match" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: amd64
            archive: tar.gz
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            archive: zip
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Cache Cargo data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ matrix.target }}-
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p package dist
          cp "target/${{ matrix.target }}/release/aposlop" package/aposlop
          tar -C package -czf "dist/aposlop-${VERSION}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz" aposlop
      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aposlop.exe" "package/aposlop.exe"
          Compress-Archive -Path "package/aposlop.exe" -DestinationPath "dist/aposlop-$env:VERSION-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/aposlop-*
          if-no-files-found: error
      - name: Build PyPI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out wheelhouse
          manylinux: auto
          docker-options: -e CFLAGS=-D_BSD_SOURCE
      - name: Upload PyPI wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Add installation scripts
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
      - name: Sign packaged binaries
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          for archive in aposlop-*-linux-*.tar.gz aposlop-*-darwin-*.tar.gz; do
            temporary="$(mktemp -d)"
            tar -xzf "$archive" -C "$temporary"
            cosign sign-blob "$temporary/aposlop" --yes --bundle "$temporary/aposlop.sigstore.json"
            tar -C "$temporary" -czf "$archive" aposlop aposlop.sigstore.json
            rm -rf "$temporary"
          done
          for archive in aposlop-*-windows-*.zip; do
            archive_path="$PWD/$archive"
            temporary="$(mktemp -d)"
            unzip -q "$archive" -d "$temporary"
            cosign sign-blob "$temporary/aposlop.exe" --yes --bundle "$temporary/aposlop.sigstore.json"
            rm "$archive"
            (
              cd "$temporary"
              zip -q "$archive_path" aposlop.exe aposlop.sigstore.json
            )
            rm -rf "$temporary"
          done
      - name: Generate checksums
        working-directory: dist
        run: sha256sum aposlop-* install.sh install.ps1 > SHA256SUMS
      - name: Sign release artifacts
        working-directory: dist
        run: |
          for artifact in *; do
            cosign sign-blob "$artifact" --yes --bundle "$artifact.sigstore.json"
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Aposlop $GITHUB_REF_NAME"

  cargo:
    name: Publish Cargo package
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"


  pypi:
    name: Publish PyPI wheels
    needs: [github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  homebrew:
    name: Publish Homebrew formula
    needs: [github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish to Homebrew tap
        uses: Justintime50/homebrew-releaser@v4.0.0
        with:
          homebrew_owner: ${{ github.repository_owner }}
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit_owner: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          install: 'bin.install "aposlop"'
          test: 'system "#{bin}/aposlop", "--version"'
          target_darwin_amd64: true
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true

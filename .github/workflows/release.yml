name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate tag and Cargo version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "tag $version and Cargo $cargo_version must match" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: amd64
            archive: tar.gz
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            archive: zip
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Cache Cargo data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ matrix.target }}-
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Sign Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/aposlop"
          cosign sign-blob "$binary" --yes --bundle "$binary.sigstore.json"
      - name: Sign Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/aposlop.exe"
          & cosign sign-blob $binary --yes --bundle "$binary.sigstore.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Package Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p package dist
          cp "target/${{ matrix.target }}/release/aposlop" package/aposlop
          cp "target/${{ matrix.target }}/release/aposlop.sigstore.json" package/aposlop.sigstore.json
          tar -C package -czf "dist/aposlop-${VERSION}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz" aposlop aposlop.sigstore.json
      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aposlop.exe" "package/aposlop.exe"
          Copy-Item "target/${{ matrix.target }}/release/aposlop.exe.sigstore.json" "package/aposlop.sigstore.json"
          Compress-Archive -Path "package/*" -DestinationPath "dist/aposlop-$env:VERSION-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/aposlop-*
          if-no-files-found: error
      - name: Build PyPI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out wheelhouse
          manylinux: auto
      - name: Upload PyPI wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Add installation scripts
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
      - name: Generate checksums
        working-directory: dist
        run: sha256sum aposlop-* install.sh install.ps1 > SHA256SUMS
      - name: Sign release artifacts
        working-directory: dist
        run: |
          for artifact in *; do
            cosign sign-blob "$artifact" --yes --bundle "$artifact.sigstore.json"
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Aposlop $GITHUB_REF_NAME"

  cargo:
    name: Publish Cargo package
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"


  pypi:
    name: Publish PyPI wheels
    needs: [github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  homebrew:
    name: Publish Homebrew formula
    needs: [github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish to Homebrew tap
        uses: Justintime50/homebrew-releaser@v4.0.0
        with:
          homebrew_owner: ${{ github.repository_owner }}
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit_owner: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          install: 'bin.install "aposlop"'
          test: 'system "#{bin}/aposlop", "--version"'
          target_darwin_amd64: true
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
